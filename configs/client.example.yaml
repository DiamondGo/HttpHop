client_id: "home-gpu-01"

server:
  url: "http://127.0.0.1:8443"
  token: "REPLACE_WITH_32B_RANDOM_TOKEN_BBBB0000"
  insecure_skip_verify: true

local:
  target: "127.0.0.1:8080"
  host_header_rewrite: ""

transport:
  poll_interval: 0s
  poll_grace: 10s
  send_timeout: 15s
  dial_timeout: 10s
  coalesce_window: 2ms
  max_send_chunk: 524288

health:
  enabled: true
  mode: "tcp"
  path: "/healthz"
  interval: 15s
  timeout: 3s

logging:
  level: "info"
