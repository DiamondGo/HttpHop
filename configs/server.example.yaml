public_listen: ":443"
http_listen: ":80"
root_domain: "httphop.io"
control_host: "tunnel.httphop.io"

tls:
  cache_dir: "/var/lib/httphop/certs"
  email: "admin@httphop.io"
  disable: true
dev_listen: ":8443"

tunnel:
  poll_timeout: 30s
  session_timeout: 60s
  sweep_interval: 5s
  coalesce_window: 2ms
  poll_buffer_size: 262144
  max_send_bytes: 1048576
  high_water_warn: 0
  poll_mode: "batch"
  max_streams_per_tunnel: 256

proxy:
  response_header_timeout: 60s
  read_header_timeout: 10s
  max_header_bytes: 65536

tunnels:
  # Recommended: whole subdomain → local service (paths unchanged).
  # DNS: myapp.httphop.io → this Server.
  - subdomain: "myapp"
    token: "REPLACE_WITH_32B_RANDOM_TOKEN_BBBB0000"
    max_clients: 1

  # Optional: apex path prefix (example.com/service/* → /* on localhost).
  # HttpHop rewrites Location and Set-Cookie Path; HTML/static assets may
  # still need app base-path config. Prefer subdomain mapping when possible.
  # - subdomain: "@"
  #   path_prefix: "/service"
  #   strip_prefix: true
  #   token: "REPLACE_WITH_32B_RANDOM_TOKEN_AAAA0000"
  #   max_clients: 1

status:
  enabled: true
  listen: "127.0.0.1:9090"

logging:
  level: "info"
