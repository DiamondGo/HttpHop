# Example Client for configs/server.builderrors.example.yaml
#
# Runs on the internal machine where 127.0.0.1:8080 is reachable.
# Must use the same token as the matching tunnel on the Server.

client_id: "home-lab-01"

server:
  url: "https://tunnel.builderrors.com"
  token: "REPLACE_WITH_RANDOM_TOKEN_AT_LEAST_32_CHARS"
  insecure_skip_verify: false

local:
  target: "127.0.0.1:8080"
  host_header_rewrite: ""

transport:
  poll_interval: 0s
  poll_grace: 10s

health:
  enabled: true
  mode: "tcp"
  interval: 15s
  timeout: 3s

logging:
  level: "info"
